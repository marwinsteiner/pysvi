[project]
name = "svi-py"
dynamic = ["version"]
description = "Stochastic volatility inspired (SVI) parametrizations of the implied volatility surface, plus the SABR model, in Python!"
authors = [{name = "Marwin Steiner"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "py-lets-be-rational>=1.0.1",
    "py-vollib>=1.0.1",
    "scipy>=1.17.0",
    "twine>=6.2.0",
]

[project.urls]
Documentation = "https://pysvi.readthedocs.io"
Repository = "https://github.com/marwinsteiner/pysvi"
Issues = "https://github.com/marwinsteiner/pysvi/issues"

[dependency-groups]
docs = [
    "sphinx>=8.0",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
]
dev = [
    "black[ruff]>=26.1.0",
    "hatch-vcs>=0.5.0",
    "hypothesis>=6.151.5",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-v --strict-markers --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pysvi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pysvi"]
